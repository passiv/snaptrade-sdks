name: Publish Python 11.x maintenance

on:
  push:
    branches:
      - maintenance/python-11.x-timeout
    paths:
      - sdks/python/pyproject.toml
      - .github/workflows/publish-python-11-maintenance.yaml

concurrency:
  group: publish-python-11-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: konfigdev/test-and-publish:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install CLI
        uses: ./.github/actions/shared/install-cli

      - name: Verify maintenance release version
        run: |
          node <<'JS'
          const fs = require('fs');
          const expected = '11.0.214';
          for (const [name, pattern] of [
            ['sdks/python/pyproject.toml', /^version = "([^"]+)"/m],
            ['sdks/python/setup.py', /^VERSION = "([^"]+)"/m],
            ['sdks/python/snaptrade_client/__init__.py', /^__version__ = "([^"]+)"/m],
            ['konfig.yaml', /^  python:\n    version: ([^\n]+)/m],
          ]) {
            if (fs.readFileSync(name, 'utf8').match(pattern)?.[1] !== expected) {
              throw new Error(`Unexpected maintenance release version in ${name}`);
            }
          }
          if (fs.existsSync('.konfig/changesets') && fs.readdirSync('.konfig/changesets').some(name => name.endsWith('.md'))) {
            throw new Error('Unconsumed changesets remain');
          }
          JS

      - name: Set up test environment
        uses: ./.github/actions/shared/inject-testing-env-vars
        with:
          test_env: ${{ secrets.TEST_ENV }}

      - name: Test Python SDK
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: konfig test --filter python

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "passiv-ops@passiv.com"
          git config --global user.name "Passiv Ops"

      - name: Publish Python SDK without regeneration
        run: konfig publish --generator python --skipTests --skipRemoteCheck --ci
        env:
          PYPI_TOKEN_1: ${{ secrets.PYPI_TOKEN_1 }}
          GH_TOKEN: ${{ github.token }}
