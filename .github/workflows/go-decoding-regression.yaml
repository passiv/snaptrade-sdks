name: Go decoding regression

on:
  pull_request:
    paths:
      - 'sdks/go/**'
      - 'konfig.yaml'
      - '.github/workflows/go-decoding-regression.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: sdks/go/go.sum
      - name: Test real response decoding without credentials
        working-directory: sdks/go
        run: |
          test -s account_positions_regression_test.go
          test -s connection_decoding_regression_test.go
          go test -count=1 -run '^Test(AccountPositions|ConnectionDecoding)Regression$' -v .
