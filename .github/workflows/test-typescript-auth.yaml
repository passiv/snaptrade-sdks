name: Validate SDK auth

on:
  pull_request:
    branches: [master]
    paths:
      - sdks/typescript/**
      - sdks/python/**
      - .github/workflows/test-typescript-auth.yaml

permissions:
  contents: read

concurrency:
  group: typescript-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 8
          run_install: false
      - name: Check SDK Markdown fences
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          for language in ('typescript', 'python'):
              readme = Path('sdks', language, 'README.md').read_text()
              assert 'Cannot parse:' not in readme, language + ': formatter error'
              assert not re.search(r'\S```', readme), language + ': joined code fence'
          PYTHON
      - name: Install SDK dependencies
        run: pnpm --dir sdks/typescript install
      - name: Check auth argument types
        run: pnpm --dir sdks/typescript typecheck
