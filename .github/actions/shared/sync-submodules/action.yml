name: Sync SDK submodules
description: Updates SDK submodules to their remote default branches
inputs:
  sdk_submodule_dirs:
    description: Space-delimited SDK submodule directories
    required: true
  push_to:
    description: Branch to push the resulting top-level commit to
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Sync submodules
      id: sync
      shell: bash
      run: |
        git submodule foreach '
          case " ${{ inputs.sdk_submodule_dirs }} " in
            *" $displaypath "*)
              default_branch=$(git ls-remote --symref origin HEAD | awk "/^ref:/ { sub(\"refs/heads/\", \"\", \$2); print \$2; exit }")
              if [ -z "$default_branch" ]; then
                echo "Could not resolve the default branch for $displaypath" >&2
                exit 1
              fi
              git fetch origin "refs/heads/$default_branch"
              git checkout FETCH_HEAD
              ;;
          esac
        '

        if [ -n "$(git status --porcelain)" ]; then
          echo "synced=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit submodule sync
      if: steps.sync.outputs.synced == 'true'
      shell: bash
      run: |
        git add -A
        git commit -m "Update submodule references"

    - name: Push submodule sync
      if: inputs.push_to != '' && steps.sync.outputs.synced == 'true'
      shell: bash
      run: git push origin "HEAD:refs/heads/${{ inputs.push_to }}"
