name: Merge submodule pull requests
description: Merges generated SDK pull requests in submodule repositories
inputs:
  sdk_submodule_dirs:
    description: Space-delimited SDK submodule directories
    required: true
  head:
    description: Head branch of the pull requests
    required: true
runs:
  using: composite
  steps:
    - name: Merge submodule pull requests
      shell: bash
      run: |
        git submodule foreach '
          case " ${{ inputs.sdk_submodule_dirs }} " in
            *" $displaypath "*)
              remote_url=$(git remote get-url origin)
              owner=$(echo "$remote_url" | cut -d "/" -f 4)
              repo=$(echo "$remote_url" | cut -d "/" -f 5 | sed "s/\.git.*//")
              konfig pr-merge \
                --owner "$owner" \
                --repo "$repo" \
                --head "${{ inputs.head }}"
              ;;
          esac
        '
